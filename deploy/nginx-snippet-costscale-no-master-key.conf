# master key 不得打生成端點（2026-08-23）
#
# 白名單裡「會消耗額度」的 location 都 include 這個檔。
# 存活檢查那兩條刻意不 include——它們本來就不需要金鑰。
#
# $costscale_is_master_key 由 /etc/nginx/conf.d/costscale-master-key-guard.conf
# 定義（那個檔含金鑰值、權限 600，由 deploy/gen-master-key-guard.sh 產生）。
# 沒有那個檔的話這個變數不存在，nginx -t 會直接失敗——這是刻意的，
# 寧可設定載不起來，也不要靜默地變成沒有這道閘。
#
# 為什麼要擋：master key 在 LiteLLM 眼裡是萬能鑰匙，打什麼模型都行，
# 而且帳目上歸不到任何軟體（/apps 的「未歸戶」那一段）。
# 要手動實測請用專屬的 ops 虛擬金鑰，那樣用量才有歸戶。
# default_type 必須放在 location 層，不能放在 if 裡（nginx: directive is not
# allowed here）。它只在上游沒帶 Content-Type 時才生效，所以放在這裡不會
# 影響正常轉發的回應。
default_type application/json;

if ($costscale_is_master_key) {
    return 403 '{"error":{"message":"gateway: master key 不得用於生成端點。請改用該軟體自己的虛擬金鑰；要手動實測請用 ops 專用的虛擬金鑰。管理 API 走 SSH 隧道打 127.0.0.1:4400."}}';
}
